[package]
name = "anirust-gui"
description = "AniRust desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "anirust"
path = "src/main.rs"

[dependencies]
anirust-api.workspace = true
anirust-download.workspace = true
anirust-extract.workspace = true
anirust-player.workspace = true
anyhow.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# renderer-femtovg is OpenGL-backed, which is what makes mpv's render API
# usable: frames land in a GL texture Slint can borrow without a CPU copy.
# renderer-software is compiled in as a runtime fallback for machines with no
# usable GL, matching the approach in the author's other Slint project.
glow = "0.18"
# Pictures arrive over HTTP and Slint needs decoded pixels. Posters are JPEG
# or PNG; avatars and pictures in posts are whatever people uploaded, which
# is WebP and GIF often enough. The rest of the format zoo is left out.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libloading = "0.9"
# Where playback positions are kept, and how the file is written.
dirs.workspace = true
# The session token belongs in the platform's secret store, not beside the
# config in plain text.
keyring.workspace = true
# The platform's own file chooser, for pictures to upload and bookmarks to
# import or export: the desktop portal on Linux, the native dialogs on Windows
# and macOS.
rfd = "0.17"
serde = { workspace = true }
serde_json.workspace = true
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    # The window's native display, which mpv needs for hardware decoding on
    # AMD and Intel under Linux.
    "raw-window-handle-06",
    # The monitor the window is on, for its refresh rate: mpv cannot see it
    # through the render API, and frame generation and interpolation need it.
    "unstable-winit-030",
] }
raw-window-handle = "0.6"

# `cargo deb -p anirust-gui` — a .deb for Debian and Ubuntu.
[package.metadata.deb]
name = "anirust"
maintainer = "mrfrok"
extended-description = """\
An unofficial desktop client for Anixart: the catalogue, an mpv-based player \
with hardware decoding, subtitles and Anime4K upscaling, and lists, history \
and progress in step with an Anixart account."""
section = "video"
priority = "optional"
depends = "$auto"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/anirust", "usr/bin/", "755"],
    ["../packaging/linux/io.github.mrfrok.AniRust.desktop", "usr/share/applications/", "644"],
    ["../packaging/linux/io.github.mrfrok.AniRust.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../packaging/icons/anirust.svg", "usr/share/icons/hicolor/scalable/apps/io.github.mrfrok.AniRust.svg", "644"],
]

[build-dependencies]
slint-build = "1.18"
winresource = { version = "0.1", default-features = false }
