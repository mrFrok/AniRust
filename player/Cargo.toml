[package]
name = "anirust-player"
description = "libmpv-backed video playback rendering into a caller-owned GL texture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
libmpv2 = "6"
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true

# Loading the Python of the VapourSynth the Windows package carries, by its
# path, before VapourSynth asks for it by name (frames.rs).
[target.'cfg(windows)'.dependencies]
libloading = "0.9"
