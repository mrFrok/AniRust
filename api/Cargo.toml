[package]
name = "anirust-api"
description = "Typed client for the Anixart mobile API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only the timer, for retry backoff.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Every endpoint is checked against a local server that knows the path, the
# method and the parameters it should receive — the protocol is verified
# without touching theirs.
wiremock = "0.6"
