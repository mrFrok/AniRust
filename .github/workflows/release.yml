# A tag `v*` builds every package and publishes a release with them, each
# with a .sha256 beside it. Started by hand (workflow_dispatch) it is a dry
# run: everything is built and kept as workflow artifacts, nothing is
# published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Linux archive, built on Arch: its own libmpv — the one with the
  # VapourSynth filter frame generation needs — is linked against the ffmpeg
  # and libplacebo of the system it is built on, so it is built on the one
  # the archive is for. Rolling distributions (Arch, CachyOS, Manjaro,
  # openSUSE Tumbleweed) run it whole; elsewhere its launcher falls back to
  # the system's libmpv, and the .deb below is the better choice.
  linux:
    name: Linux archive (Arch)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Tools and libraries
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup curl unzip 7zip python python-pip \
            mpv vapoursynth meson ninja cmake \
            wayland-protocols vulkan-headers libxkbcommon fontconfig
          rustup default stable
          pip install --break-system-packages onnx onnxconverter-common
      - uses: actions/checkout@v4
      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@v2
      # libmpv with the filter, RIFE, and vs-mlrt for TensorRT, OpenVINO and
      # MIGraphX: packaging/linux/build-tarball.sh builds or fetches each.
      - name: Tarball
        run: packaging/linux/build-tarball.sh
      # vs-mlrt on its own as well, for packages that build the program
      # themselves (packaging/arch/PKGBUILD).
      - name: vs-mlrt archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tar -C target -czf "dist/anirust-$version-mlrt-linux-x86_64.tar.gz" mlrt
      - name: Checksums
        run: cd dist && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # The .deb plays through the system's libmpv: a libmpv of its own would tie
  # it to one Ubuntu's ffmpeg sonames. Frame generation needs a libmpv with
  # the VapourSynth filter, which Debian and Ubuntu do not build.
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev libxkbcommon-dev libfontconfig-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked -p anirust-gui -p anirust-cli
      - run: cargo deb -p anirust-gui --no-build --output dist/
      - name: Checksums
        run: cd dist && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*

  # One file for glibc distributions as old as Ubuntu 24.04, with its own
  # libmpv, RIFE and vs-mlrt (packaging/linux/build-appimage.sh).
  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libxkbcommon-dev libfontconfig-dev \
            meson ninja-build cmake pkg-config git curl unzip p7zip-full zstd \
            python3-pip librsvg2-bin \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libavutil-dev \
            libswscale-dev libswresample-dev libass-dev libplacebo-dev \
            libva-dev libdrm-dev libegl-dev libgl-dev libgbm-dev \
            libwayland-dev wayland-protocols libx11-dev libxext-dev libxpresent-dev \
            libxrandr-dev libxss-dev libxv-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev \
            liblcms2-dev libzimg-dev libuchardet-dev libjpeg-dev \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxi6 libxrandr2
          pip install --break-system-packages onnx onnxconverter-common
      - uses: Swatinem/rust-cache@v2
      - name: AppImage
        run: packaging/linux/build-appimage.sh
      - name: Checksums
        run: cd dist && for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  # The whole player in its own runtime: any Linux, those without glibc
  # (Alpine, Void musl, Chimera) included (packaging/flatpak/).
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    env:
      APP_ID: io.github.mrfrok.AniRust
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak, the runtime and the networks
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder p7zip-full python3-pip
          pip install --break-system-packages onnx onnxconverter-common
          # The runtime version is read from the manifest, so the two
          # cannot drift apart.
          runtime=$(sed -n "s/^runtime-version: *'\([^']*\)'.*/\1/p" "packaging/flatpak/$APP_ID.yml")
          [ -n "$runtime" ] || { echo "no runtime-version in the manifest"; exit 1; }
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            "org.freedesktop.Platform//$runtime" "org.freedesktop.Sdk//$runtime" \
            "org.freedesktop.Sdk.Extension.rust-stable//$runtime"
          python3 packaging/mlrt/prepare-models.py target/mlrt
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-
      - name: Bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build "packaging/flatpak/$APP_ID.yml"
          mkdir -p dist
          name="anirust-$version-x86_64.flatpak"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo "dist/$name" "$APP_ID"
          cd dist && sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  windows:
    name: Windows zip
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python and build tools
        run: pip install onnx onnxconverter-common ninja
      - name: libmpv
        shell: pwsh
        run: ./packaging/windows/fetch-libmpv.ps1 -Destination mpv
      - name: Build and stage
        shell: pwsh
        run: |
          $env:MPV_SOURCE = "$PWD\mpv"
          $env:LIB = "$PWD\mpv;$env:LIB"
          cargo build --release --locked -p anirust-gui -p anirust-cli
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $name = "anirust-$version-windows-x86_64"
          New-Item -ItemType Directory -Force "stage\$name" | Out-Null
          Copy-Item target\release\anirust.exe, target\release\anirust-cli.exe, mpv\libmpv-2.dll, README.md, README.ru.md, LICENSE "stage\$name\"
          "name=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Frame generation on any GPU: the RIFE plugin and models. VapourSynth
      # itself the user installs (README).
      - name: RIFE
        run: packaging/fetch-rife.sh windows "stage/$name/rife"
      # The GPUs' matrix units: vs-mlrt for TensorRT and OpenVINO, built with
      # MSVC, and the networks. The vendors' runtimes are fetched by the
      # player when asked.
      - name: vs-mlrt
        run: |
          out="$(pwd)/stage/$name/mlrt"
          OUT_DIR="$out" WORK_DIR="$(pwd)/target/mlrt-build" packaging/mlrt/build-vstrt.sh
          OUT_DIR="$out" WORK_DIR="$(pwd)/target/mlrt-build" packaging/mlrt/build-vsov.sh
          python packaging/mlrt/prepare-models.py "$out"
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "stage\$env:name" -DestinationPath "dist\$env:name.zip"
          $hash = (Get-FileHash "dist\$env:name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:name.zip" | Out-File -FilePath "dist\$env:name.zip.sha256" -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS disk image
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install mpv dylibbundler librsvg
      - uses: Swatinem/rust-cache@v2
      - name: Build and pack
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$LIBRARY_PATH"
          cargo build --release --locked -p anirust-gui -p anirust-cli
          packaging/fetch-rife.sh macos-arm64 target/rife-macos
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          RIFE_DIR=target/rife-macos ./packaging/macos/bundle.sh "$version"
          cd dist && for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg*

  release:
    name: Publish
    needs: [linux, deb, appimage, flatpak, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
